<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>London 2026 — July 9-19</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; }

  #app { display: flex; height: 100vh; }

  /* Sidebar */
  #sidebar {
    width: 380px; min-width: 380px;
    display: flex; flex-direction: column;
    background: #161616; border-right: 1px solid #2a2a2a;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid #2a2a2a;
  }
  #sidebar-header h1 { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  #sidebar-header p { font-size: 12px; color: #888; }

  /* Search */
  #search {
    width: 100%; padding: 8px 12px;
    background: #222; border: 1px solid #333; border-radius: 6px;
    color: #e0e0e0; font-size: 13px; margin-top: 10px; outline: none;
  }
  #search:focus { border-color: #555; }
  #search::placeholder { color: #666; }

  /* Filters */
  #filters {
    padding: 10px 20px;
    display: flex; flex-wrap: wrap; gap: 6px;
    border-bottom: 1px solid #2a2a2a;
  }
  .filter-btn {
    padding: 4px 10px; border-radius: 12px;
    font-size: 11px; cursor: pointer;
    border: 1px solid #444; background: transparent; color: #aaa;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: #666; color: #ddd; }
  .filter-btn.active { color: #fff; border-color: currentColor; }

  /* List */
  #list {
    flex: 1; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: #333 transparent;
  }
  .place-item {
    padding: 12px 20px; cursor: pointer;
    border-bottom: 1px solid #1e1e1e;
    transition: background 0.1s;
  }
  .place-item:hover { background: #1e1e1e; }
  .place-item.selected { background: #1a1a2e; border-left: 3px solid #6366f1; }
  .place-name {
    font-size: 14px; font-weight: 500; color: #fff;
    display: flex; align-items: center; gap: 6px;
  }
  .place-cat-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .place-note {
    font-size: 12px; color: #888; margin-top: 3px;
    line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .place-count {
    padding: 8px 20px; font-size: 11px; color: #555;
    border-bottom: 1px solid #1e1e1e;
  }

  /* Map */
  #map-container { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }

  /* Info Panel */
  #info {
    position: absolute; bottom: 20px; left: 20px; right: 20px;
    max-width: 500px;
    background: rgba(22,22,22,0.95); backdrop-filter: blur(10px);
    border: 1px solid #333; border-radius: 12px;
    padding: 16px 20px;
    display: none; z-index: 1000;
  }
  #info.visible { display: block; }
  #info-close {
    position: absolute; top: 10px; right: 14px;
    background: none; border: none; color: #888; font-size: 18px; cursor: pointer;
  }
  #info-name { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; padding-right: 30px; }
  #info-category { font-size: 11px; color: #888; margin-bottom: 8px; }
  #info-note { font-size: 13px; color: #ccc; line-height: 1.5; margin-bottom: 10px; }
  #info-links { display: flex; gap: 8px; flex-wrap: wrap; }
  #info-links a {
    font-size: 12px; color: #6366f1; text-decoration: none;
    padding: 4px 10px; border: 1px solid #6366f1; border-radius: 6px;
    transition: all 0.15s;
  }
  #info-links a:hover { background: #6366f1; color: #fff; }

  /* Responsive */
  @media (max-width: 768px) {
    #app { flex-direction: column-reverse; }
    #sidebar { width: 100%; min-width: 0; height: 45vh; }
    #map-container { height: 55vh; }
    #info { bottom: 10px; left: 10px; right: 10px; }
  }

  /* Timeline overlay */
  #timeline-toggle {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    background: rgba(22,22,22,0.9); border: 1px solid #333;
    color: #ccc; padding: 6px 12px; border-radius: 8px;
    font-size: 12px; cursor: pointer;
  }
  #timeline-toggle:hover { background: rgba(40,40,40,0.95); color: #fff; }
  #timeline {
    position: absolute; top: 50px; right: 12px; z-index: 1000;
    background: rgba(22,22,22,0.95); border: 1px solid #333;
    border-radius: 12px; padding: 14px 18px;
    max-height: 70vh; overflow-y: auto; width: 360px;
    display: none; font-size: 12px;
    scrollbar-width: thin; scrollbar-color: #333 transparent;
  }
  #timeline.visible { display: block; }
  #timeline h3 { font-size: 13px; color: #fff; margin-bottom: 10px; }
  .tl-date { color: #6366f1; font-weight: 600; margin-top: 8px; }
  .tl-event { color: #ccc; margin-left: 8px; padding: 2px 0; }
  .tl-grade { font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 4px; }
  .tl-grade-a { background: #059669; color: #fff; }
  .tl-grade-b { background: #6366f1; color: #fff; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>London July 9–19, 2026</h1>
      <p>104 places across 7 categories</p>
      <input type="text" id="search" placeholder="Search places...">
    </div>
    <div id="filters"></div>
    <div id="list"></div>
  </div>
  <div id="map-container">
    <div id="map"></div>
    <button id="timeline-toggle">Timeline</button>
    <div id="timeline"></div>
    <div id="info">
      <button id="info-close">&times;</button>
      <div id="info-name"></div>
      <div id="info-category"></div>
      <div id="info-note"></div>
      <div id="info-links"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TIMELINE = [
  { date: "Jul 9 (Wed)", events: [{ text: "Gasworks — Thuy Tien Nguyen opening", grade: "" }] },
  { date: "Jul 10 (Thu)", events: [
    { text: "Cafe OTO — I-D.A Projects (Paul McCarthy/LAFMS)", grade: "A+" },
    { text: "Wellcome Collection — Audrey Amiss + Rudy Loewe opening", grade: "" },
    { text: "Chisenhale Gallery — Jasper Marsalis opening", grade: "" },
    { text: "Barbican — Album Art Analysis event", grade: "" },
  ]},
  { date: "Jul 11 (Fri)", events: [{ text: "Cafe OTO — I-D.A Projects Day 2", grade: "A+" }] },
  { date: "Jul 12 (Sat)", events: [
    { text: "Cafe OTO — I-D.A Projects Day 3", grade: "A+" },
    { text: "The Carpet Shop — Oroko Radio night (Gqom)", grade: "" },
  ]},
  { date: "Jul 13 (Sun)", events: [{ text: "Cafe OTO — Tomeka Reid Quartet (Mary Halvorson)", grade: "A" }] },
  { date: "Jul 14–15", events: [{ text: "Cafe OTO — James Brandon Lewis Quartet", grade: "A-" }] },
  { date: "Jul 16 (Wed)", events: [{ text: "Somerset House Summer Series starts (Naika)", grade: "" }] },
  { date: "Jul 17 (Thu)", events: [
    { text: "BBC Proms First Night — Yunchan Lim", grade: "A" },
    { text: "Cafe OTO — Kurdish Sound Archive", grade: "A-" },
  ]},
  { date: "Jul 18 (Fri)", events: [
    { text: "BBC Proms — Prog Rock", grade: "B+" },
    { text: "Cafe OTO — Kurdish Sound Archive Day 2", grade: "A-" },
  ]},
  { date: "Jul 19 (Sat)", events: [{ text: "BBC Proms — Bolero: Rhythms of Spain", grade: "A" }] },
];

let DATA, map, markers = [], activeFilters = new Set(), selectedId = null;

async function init() {
  const res = await fetch("data.json");
  DATA = await res.json();

  map = L.map("map", { zoomControl: false }).setView([51.522, -0.065], 13);
  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 19,
  }).addTo(map);

  buildFilters();
  buildTimeline();
  renderPlaces();

  document.getElementById("search").addEventListener("input", renderPlaces);
  document.getElementById("info-close").addEventListener("click", () => {
    document.getElementById("info").classList.remove("visible");
    selectedId = null;
    renderPlaces();
  });
  document.getElementById("timeline-toggle").addEventListener("click", () => {
    document.getElementById("timeline").classList.toggle("visible");
  });
}

function buildFilters() {
  const container = document.getElementById("filters");
  const allBtn = document.createElement("button");
  allBtn.className = "filter-btn active";
  allBtn.textContent = "All";
  allBtn.style.color = "#fff";
  allBtn.addEventListener("click", () => {
    activeFilters.clear();
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    allBtn.classList.add("active");
    renderPlaces();
  });
  container.appendChild(allBtn);

  for (const [key, meta] of Object.entries(DATA.categories)) {
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.textContent = `${meta.emoji} ${meta.label}`;
    btn.dataset.cat = key;
    btn.addEventListener("click", () => {
      allBtn.classList.remove("active");
      if (activeFilters.has(key)) {
        activeFilters.delete(key);
        btn.classList.remove("active");
      } else {
        activeFilters.add(key);
        btn.classList.add("active");
        btn.style.color = meta.color;
      }
      if (activeFilters.size === 0) allBtn.classList.add("active");
      renderPlaces();
    });
    container.appendChild(btn);
  }
}

function buildTimeline() {
  const container = document.getElementById("timeline");
  let html = "<h3>Confirmed Events</h3>";
  for (const day of TIMELINE) {
    html += `<div class="tl-date">${day.date}</div>`;
    for (const ev of day.events) {
      let grade = "";
      if (ev.grade) {
        const cls = ev.grade.startsWith("A") ? "tl-grade-a" : "tl-grade-b";
        grade = `<span class="tl-grade ${cls}">${ev.grade}</span>`;
      }
      html += `<div class="tl-event">${ev.text}${grade}</div>`;
    }
  }
  html += `<div style="margin-top:12px;color:#555;font-size:11px;">Recheck in mid-June: FOLD, MOT, Ormside, SET, IKLECTIK, EartH, Hundred Years Gallery</div>`;
  container.innerHTML = html;
}

function getFiltered() {
  const query = document.getElementById("search").value.toLowerCase();
  return DATA.places.filter(p => {
    if (activeFilters.size > 0 && !activeFilters.has(p.category)) return false;
    if (query && !p.name.toLowerCase().includes(query) && !p.note.toLowerCase().includes(query)) return false;
    return true;
  });
}

function renderPlaces() {
  const filtered = getFiltered();
  const list = document.getElementById("list");

  // Count
  let html = `<div class="place-count">${filtered.length} places</div>`;
  for (const p of filtered) {
    const meta = DATA.categories[p.category];
    const sel = p.id === selectedId ? " selected" : "";
    html += `<div class="place-item${sel}" data-id="${p.id}">
      <div class="place-name">
        <span class="place-cat-dot" style="background:${meta.color}"></span>
        ${p.name}
      </div>
      <div class="place-note">${p.note}</div>
    </div>`;
  }
  list.innerHTML = html;

  list.querySelectorAll(".place-item").forEach(el => {
    el.addEventListener("click", () => selectPlace(parseInt(el.dataset.id)));
  });

  // Update markers
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  for (const p of filtered) {
    const meta = DATA.categories[p.category];
    const size = p.id === selectedId ? 12 : 8;
    const marker = L.circleMarker([p.lat, p.lng], {
      radius: size,
      fillColor: meta.color,
      fillOpacity: p.id === selectedId ? 1 : 0.7,
      color: p.id === selectedId ? "#fff" : meta.color,
      weight: p.id === selectedId ? 2 : 1,
    }).addTo(map);
    marker.on("click", () => selectPlace(p.id));
    marker.bindTooltip(p.name, { direction: "top", offset: [0, -8] });
    markers.push(marker);
  }
}

function selectPlace(id) {
  selectedId = id;
  const p = DATA.places.find(x => x.id === id);
  const meta = DATA.categories[p.category];

  document.getElementById("info-name").textContent = p.name;
  document.getElementById("info-category").innerHTML =
    `<span style="color:${meta.color}">${meta.emoji} ${meta.label}</span>`;
  document.getElementById("info-note").textContent = p.note;

  const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(p.query)}`;
  document.getElementById("info-links").innerHTML =
    `<a href="${mapsUrl}" target="_blank">Google Maps</a>`;

  document.getElementById("info").classList.add("visible");
  map.flyTo([p.lat, p.lng], 15, { duration: 0.5 });
  renderPlaces();

  // Scroll list item into view
  const el = document.querySelector(`.place-item[data-id="${id}"]`);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

init();
</script>
</body>
</html>
